[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosbox-llm"
version = "0.1.0"
description = "Headless DOSBox-X control for LLM agents: agent RPC client, MCP server and dbx CLI"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dbx = "dosbox_mcp.cli:main"
dosbox-mcp = "dosbox_mcp.server:main"

[tool.setuptools]
packages = ["dosbox_agent", "dosbox_mcp"]
